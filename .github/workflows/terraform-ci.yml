name: terraform-ci

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  fmt-validate-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Global env to keep Terraform quiet and offline
    env:
      TF_IN_AUTOMATION: "true"
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform FMT (auto-fix)
        run: terraform fmt -recursive

      # Prevent any backend checks; we only need local plan in CI
      - name: Terraform Init (no backend)
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      # The key: refresh OFF so provider won’t call AWS; stay fully offline
      - name: Terraform Plan (offline)
        run: terraform plan -no-color -input=false -refresh=false -out=tfplan.bin

      - name: Terraform Show → plan.txt
        run: terraform show -no-color tfplan.bin | tee plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-5711
          path: plan.txt
